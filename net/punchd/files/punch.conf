# punchd 的非敏感默认值（随 punchd 包分发，且是 conffile —— sysupgrade 保留这里的
# 编辑；**不要**往这里写 token）。
#
# 这个文件的键名以 punchd 的解析器为准（github.com/2017fighting/punch，
# internal/agent/config.go）：未知键是**启动错误**，不是被忽略的注释。改这里之前先看那边。
#
# 一条 punch 是多少（端口、目标）不在这里：它由集群里的 `Punch` CR 声明（home-ops
# ADR-0044），punchd 每 15s 拉一次并把结果渲染成一张自有的 `table ip punch`。
# 这里写的全是**这台设备的事实**——出口接口、运营商 STUN/HTTP 目标、fwmark。

# 集群侧地址：走 Edge VIP（192.168.9.64），由 honk 的
# `domain(geosite: self-raenzo) -> direct` 保证直连——整条交互不出 LAN。
# 名字由集群 CoreDNS 的 k8s_gateway 从 HTTPRoute 现场合成，不需要任何 DNS 记录。
cluster_url=https://punch.raenzo.com

# bearer token 是**设备本地**的 0600 文件（形状见 token.example —— 那只是形状，
# 不是任何设备的真 token）。它与 home-ops 的
# infrastructure/punch/secret.sops.yaml（`token` 键）是同一份凭据的两个家：轮换必须
# 两边一起改，改完 `/etc/init.d/punchd restart`；集群侧那次是 `sops edit` +
# `kubectl -n punch rollout restart deploy/punch-controller`。
token_file=/etc/punch/token

# natmap 的三项：STUN（发现映射）、HTTP（TCP 保活目标，**必须是远端**，否则运营商
# 那条映射没人给它续命）、出口设备名。
stun=stun.m-online.net
http=www.baidu.com
iface=pppoe-wan

# 66 是现网两条 natmap 实例在用的 fwmark；不写会让这条流可能走错路由表。
fwmark=66

# 15s = ADR-0044 的周期，也是集群侧 60s 死线的 1/4：丢两个 tick 还能自愈，丢四个
# 才算「agent 不说话」。natmap 自己的 STUN 刷新周期是 punchd 里的常量 `-k 30`。
interval=15s
